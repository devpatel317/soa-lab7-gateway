services:
  # -------------------------------------------------------------
  # API Gateway (Single External Entry Point - Port 8080)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - PROXY_TIMEOUT_MS=10000
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # User Service (Internal Only - Connected to MongoDB Atlas)
  # -------------------------------------------------------------
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - PORT=3001
      - MONGO_URI=${USER_MONGO_URI:-${MONGO_URI}}
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # Product Service (Internal Only - Connected to MongoDB Atlas)
  # -------------------------------------------------------------
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      - PORT=3002
      - MONGO_URI=${PRODUCT_MONGO_URI:-${MONGO_URI}}
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # Order Service (Internal Only - Connected to MongoDB Atlas)
  # -------------------------------------------------------------
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      - PORT=3003
      - MONGO_URI=${ORDER_MONGO_URI:-${MONGO_URI}}
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - HTTP_TIMEOUT_MS=5000
    depends_on:
      - user-service
      - product-service
    networks:
      - lab7-network

# -------------------------------------------------------------
# Networks (No local DB volumes required when using Atlas)
# -------------------------------------------------------------
networks:
  lab7-network:
    driver: bridge
    name: lab7-network
