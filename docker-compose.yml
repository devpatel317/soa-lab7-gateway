services:
  # -------------------------------------------------------------
  # API Gateway (Single External Entry Point - Port 8080)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - PROXY_TIMEOUT_MS=5000
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # User Database (Dedicated MongoDB instance for User Service)
  # -------------------------------------------------------------
  user-db:
    image: mongo:7.0
    container_name: user-db
    restart: unless-stopped
    volumes:
      - user_db_data:/data/db
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # User Service (Internal Only - Reachable inside Docker Network)
  # -------------------------------------------------------------
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://user-db:27017/userdb
    depends_on:
      - user-db
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # Product Database (Dedicated MongoDB instance for Product Service)
  # -------------------------------------------------------------
  product-db:
    image: mongo:7.0
    container_name: product-db
    restart: unless-stopped
    volumes:
      - product_db_data:/data/db
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # Product Service (Internal Only - Reachable inside Docker Network)
  # -------------------------------------------------------------
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://product-db:27017/productdb
    depends_on:
      - product-db
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # Order Database (Dedicated MongoDB instance for Order Service)
  # -------------------------------------------------------------
  order-db:
    image: mongo:7.0
    container_name: order-db
    restart: unless-stopped
    volumes:
      - order_db_data:/data/db
    networks:
      - lab7-network

  # -------------------------------------------------------------
  # Order Service (Internal Only - Reachable inside Docker Network)
  # -------------------------------------------------------------
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://order-db:27017/orderdb
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - HTTP_TIMEOUT_MS=3000
    depends_on:
      - order-db
      - user-service
      - product-service
    networks:
      - lab7-network

# -------------------------------------------------------------
# Networks & Persistent Volumes
# -------------------------------------------------------------
networks:
  lab7-network:
    driver: bridge
    name: lab7-network

volumes:
  user_db_data:
    driver: local
  product_db_data:
    driver: local
  order_db_data:
    driver: local
